name: Release

# Publishing a GitHub release with a version tag (v0.2.0, or v0.2.0-beta1 for a
# pre-release) tests and packages the add-on and attaches the zip to the release.
# Once the CURSEFORGE_PROJECT_ID repository variable is set, it also uploads the
# package to CurseForge for both clients. Until then the CurseForge step is skipped.
# The release's notes become the changelog on CurseForge and in the package.
on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      # The packaged manifests must carry exactly this version.
      EXPECTED_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag is a valid version
        run: tools/check-release-tag.sh "$TAG"

      - name: Check the pre-release setting matches the tag
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          expected=false
          case "$TAG" in *alpha*|*beta*) expected=true ;; esac
          if [ "$PRERELEASE" != "$expected" ]; then
            echo "::error::Tag $TAG should have 'Set as a pre-release' $([ "$expected" = true ] && echo checked || echo unchecked). Tags with alpha or beta are pre-releases; others are full releases."
            exit 1
          fi

      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0

      - name: Lint and run tests
        run: |
          luarocks install busted
          luarocks install luacheck
          luacheck . && busted

      - name: Use the release notes as the changelog
        env:
          NOTES: ${{ github.event.release.body }}
        run: |
          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$NOTES" > CHANGELOG.md
          else
            echo "The release has no notes; the changelog is generated from git history."
          fi

      - name: Build and validate the package without uploading
        run: tools/build-package.sh

      - name: Upload to CurseForge
        if: ${{ vars.CURSEFORGE_PROJECT_ID != '' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          PUBLISH_DIR: .release/published
        run: tools/publish-release.sh

      - name: Note that CurseForge was skipped
        if: ${{ vars.CURSEFORGE_PROJECT_ID == '' }}
        run: echo "::notice::CURSEFORGE_PROJECT_ID is not set, so nothing was uploaded to CurseForge. The zip is attached to the GitHub release only. See docs/packaging.md."

      - name: Attach the package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prefer the exact zip that was uploaded to CurseForge, if any.
          dir=.release/published
          [ -d "$dir" ] || dir=.release
          gh release upload "$TAG" "$dir"/AsgardsGuildFellowship-*.zip --clobber
